name: Build FPA macOS Apple Silicon

on:
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-26

    steps:
      - name: Descarregar el projecte
        uses: actions/checkout@v4

      - name: Comprovar arquitectura
        run: |
          uname -m

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          brew install create-dmg

      - name: Comprovar Python
        run: |
          python --version
          python -c "import platform; print(platform.machine())"

      - name: Compilar FPA Apple Silicon
        run: |
          pyinstaller --noconfirm --clean FPA.spec

      - name: Comprovar arquitectura de FPA
        run: |
          file dist/FPA.app/Contents/MacOS/FPA

      - name: Crear carpeta DMG
        run: |
          rm -rf dmg
          mkdir dmg
          cp -R dist/FPA.app dmg/

      - name: Crear DMG Apple Silicon
        run: |
          create-dmg \
            --volname "Football Pass Analyzer" \
            --window-size 600 400 \
            --icon-size 120 \
            --app-drop-link 450 200 \
            "FPA-macOS-Apple-Silicon.dmg" \
            "dmg"

      - name: Pujar DMG com artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPA-macOS-Apple-Silicon
          path: FPA-macOS-Apple-Silicon.dmg
