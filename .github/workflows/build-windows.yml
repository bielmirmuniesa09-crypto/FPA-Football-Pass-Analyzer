name: Build FPA for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descarregar el projecte
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar FPA per Windows
        run: |
          pyinstaller --noconfirm --clean FPA.spec

      - name: Comprovar fitxers generats
        run: |
          Get-ChildItem -Recurse dist

      - name: Pujar aplicació de Windows
        uses: actions/upload-artifact@v4
        with:
          name: FPA-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 30
          
