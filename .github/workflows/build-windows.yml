name: Build FPA Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descarregar el projecte
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instal·lar dependències
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar l'aplicació
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean FPA.spec

      - name: Instal·lar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Crear l'instal·lador
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Comprovar l'instal·lador
        shell: pwsh
        run: |
          Get-ChildItem -Recurse installer-output

      - name: Pujar FPA Setup
        uses: actions/upload-artifact@v4
        with:
          name: FPA-Windows-Installer
          path: installer-output/FPA-Setup.exe
          if-no-files-found: error
          retention-days: 30
